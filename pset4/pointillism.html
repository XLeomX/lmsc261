<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

const numCircles = 256

for(let c = 1; c <= numCircles; c++){
    let xPos = Math.random() * w;
    let yPos = Math.random() * h;
ctx.beginPath();
        ctx.arc(
        xPos, 
        yPos, 
        10, 
        0, 
        Math.PI * 2
    );
    let isAbove = yPos < 300
    if(isAbove) {
        ctx.fillStyle = "#EF998D";
    }
    else {
        ctx.fillStyle = "#F0AA75";
    }
    
        ctx.fill();
}


</script>
